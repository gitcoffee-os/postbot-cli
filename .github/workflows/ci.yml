name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/postbot-cli/**'
      - 'packages/sdk/postbot-sdk/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/postbot-cli/**'
      - 'packages/sdk/postbot-sdk/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @gitcoffee/postbot-sdk build

      - name: Build CLI
        run: pnpm --filter @gitcoffee/postbot-cli build

      - name: Typecheck
        run: pnpm --filter @gitcoffee/postbot-cli typecheck

      - name: Test
        run: pnpm --filter @gitcoffee/postbot-cli test
